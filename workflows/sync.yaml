name: Sync

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        repo:
          - source: https://sourceware.org/git/glibc.git
            target: just-mirror/glibc
          - source: https://sourceware.org/git/binutils-gdb.git
            target: just-mirror/binutils-gdb
          - source: https://codeberg.org/ziglang/zig.git
            target: just-mirror/zig
          - source: https://git.musl-libc.org/git/musl
            target: just-mirror/musl
    uses: ./.github/workflows/mirror.yaml
    with:
      source_repo: ${{ matrix.repo.source }}
      target_repo: ${{ matrix.repo.target }}
    secrets:
      target_token: ${{ secrets.TARGET_TOKEN }}
