name: Sync

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        repository:
          - source: "https://sourceware.org/git/glibc.git"
            target: glibc
          - source: "https://sourceware.org/git/binutils-gdb.git"
            target: binutils-gdb
          - source: "https://codeberg.org/ziglang/zig.git"
            target: zig
          - source: "https://git.musl-libc.org/git/musl"
            target: musl
    steps:
      - uses: "$/.github/actions/mirror"
        with:
          source_url: "${{ matrix.repository.source }}"
          target_url: "${{ format('https://x-access-token:{0}@github.com/{1}/{2}.git', secrets.ACCESS_TOKEN, github.repository_owner, matrix.repository.target) }}"
